version: '3.8'

services:
  # PostgreSQL Database for PayVault Microservices
  postgres:
    image: postgres:16-alpine
    container_name: payvault-postgres
    environment:
      POSTGRES_DB: payvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payvault"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
